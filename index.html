<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер покупок</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(180deg, #FFFFFF 0%, #E6EFF9 100%);
            color: #0A0E14;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            font-size: 16px;
            color: #8A94A6;
            line-height: 1.5;
        }
        .icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #0066FF 0%, #4A90FF 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 20px rgba(0, 102, 255, 0.25);
        }
        .icon svg {
            width: 56px;
            height: 56px;
            fill: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
        </div>
        <h1>Менеджер покупок</h1>
        <p>Приложение для удобного ведения списков покупок</p>
    </div>
</body>
</html>
